- id: skillcontrast
  title: 'SkillContrast: Difference-Guided Text Selection for Agent Skill Reranking'
  year: 2026
  venue: arXiv preprint arXiv:2610.11650
  venue_short: arXiv
  authors: Jiandong Ding, Honglei Ji, Ming Liu, Tao Duan
  publication_date: "2026-10-08"
  topic: llm-agents
  program: auditable-retrieval
  level: c
  selected: false
  status: preprint
  paper_url: https://arxiv.org/abs/2610.11650
  paper_label: arXiv
  digest_url: "/skillcontrast/"
  digest_label: Digest
  digest_note: A training-free selector for agent skill reranking that feeds a pretrained reranker the text that differs among retrieved candidate skills, keeping the conditions of use that query-based selection drops.
  digest_blocks:
    - title: Problem
      text: Similar agent skills can share nearly identical instructions while differing in their conditions of use. Standard query-based text selection tends to keep the shared parts and drop these distinguishing details, so the reranker receives text that cannot separate the candidates.
    - title: Approach
      text: SkillContrast is a training-free selector. It compares retrieved candidate skills against each other and keeps the differing text together with local context as the input to a pretrained reranker, so the comparison signal comes from the candidates themselves rather than from the query alone.
    - title: Public evidence
      text: On 1,235 requests from SameCapRisk-Bench, SkillContrast yields 54 to 72 more clean hits (retrieving a helpful skill without its risky sibling) than TF-IDF query selection at equal input length, across two retrievers and two reranker sizes. Cutting model-input tokens by 51.1 to 58.8 percent versus full skill bodies costs 10 to 18 clean hits at a 0.6B reranker while matching or beating query selection at 4B. These are benchmark measurements, not production deployment results.
    - title: Takeaway
      text: Candidate-relative differences complement query relevance when forming compact reranking inputs, extending the skill-retrieval line from measuring same-family risk exposure to reducing it before reranking.
- id: tois-popularity-bias
  title: Mitigating Popularity Bias in Recommendation with Global Listwise Learning and Progressive Bi-Weighting
  year: 2026
  venue: ACM Transactions on Information Systems (TOIS)
  venue_short: TOIS
  venue_type: journal
  authors: Tianyu Zhu, Jiandong Ding, Yansong Shi, Guoqing Chen, Jian-Yun Nie
  publication_date: "2026-09-28"
