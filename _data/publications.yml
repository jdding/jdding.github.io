  code_label: Code
  digest_url: "/sidscope/"
  digest_label: Digest
  doi_url: https://doi.org/10.48550/arXiv.2608.18779
  digest_note: A 2026 arXiv resource paper for auditing Semantic-ID interfaces in generative recommendation before downstream training, refresh, or model reuse.
  digest_blocks:
    - title: Problem
      text: Semantic-ID mappings are reusable interfaces between item tokenizers and generative recommenders, but released mappings often omit whether they are coherent, traceable, or safe to reuse after refresh.
    - title: Approach
      text: SIDScope normalizes item-to-code artifacts, verifies provenance and joins, profiles mapping structure, compares paired revisions, and accounts for generated path-to-item outcomes.
    - title: Findings
      text: The resource shows that interface health is multi-signal rather than scalar; prefix alignment matters when retrieval consumes prefixes, and mapping repair does not automatically validate reuse of an inherited generator.
    - title: Takeaway
      text: The work turns Semantic-ID artifacts into auditable interfaces, supporting decisions about readiness, interface risk, and revalidation before model reuse.
