  paper_label: arXiv
  code_url: https://github.com/jdding/sidinspector
  code_label: Code
  digest_url: "/sidinspector/"
  digest_label: Digest
  digest_note: A CIKM 2026 resource paper for inspecting Semantic-ID tokenizers through their mapping behavior before downstream recommendation training.
  digest_blocks:
    - title: Problem
      text: Exported item-to-code mappings from Semantic-ID tokenizers usually lack a shared inspection interface, so coverage gaps, aliasing, weak prefixes, tail compression, and fan-out problems tend to surface only after downstream recommendation training has already paid for them.
    - title: Approach
      text: SIDInspector is mapping-first. An adapter contract covers item mappings, metadata, interactions, and generator traces, and probes report utilization, aliasing, neighborhood alignment, popularity allocation, and structural cost. It inspects the interface itself rather than a trained recommender.
    - title: Public evidence
      text: The release evaluates four tokenizer families, including GRID-style RQ-KMeans, ReSID/GAOQ, LETTER, and LC-Rec artifacts. Reported measurements show D2 aliasing dropping substantially under added capacity and reaching zero for ReSID/GAOQ, while D3 stays below a deterministic category-prefix control. These are diagnostic measurements of the mappings, not evidence of recommendation-quality gains.
    - title: Takeaway
      text: Capacity, addressability, and prefix alignment are distinct, measurable properties of a Semantic-ID interface. Checking them before method-level evaluation or reuse avoids attributing downstream failures to the wrong layer.
