  selected: false
  status: accepted
  image: "/assets/images/TOIS2026.png"
  digest_image: true
  selected_label: TOIS 2026 (Accepted)
  selected_summary: Global listwise learning with progressive bi-weighting to mitigate popularity bias in recommendation.
  paper_url: https://arxiv.org/abs/2609.35041
  paper_label: arXiv
  digest_url: "/tois-popularity-bias/"
  digest_label: Digest
  digest_note: An accepted ACM Transactions on Information Systems paper studying popularity-bias mitigation through global listwise learning and progressive bi-weighting.
  digest_blocks:
    - title: Problem
      text: User feedback follows a long-tail distribution, and models trained on it disproportionately favor popular items. Inverse propensity scoring reweights interactions, but IPS-based objectives are locally unbiased at best and depend on propensity estimates that are themselves inaccurate.
    - title: Approach
      text: The paper proposes Mult-BiW. Mult-IPS integrates multinomial likelihood with IPS so that the listwise objective captures global, unbiased preference over the entire item set. Bi-Weighting jointly uses propensity scores and a collection model with a smoothing mechanism, supported by an upper bound on empirical bias and a characterization of the optimal collection model. Progressive Bi-Weighting gradually transitions from discriminative representation learning to popularity debiasing, because aggressive reweighting can harm representation learning.
    - title: Public evidence
      text: Experiments on real-world datasets report that Mult-BiW consistently outperforms state-of-the-art debiasing baselines. The public abstract does not give numeric metrics, and the article is accepted at ACM TOIS but not yet formally published.
    - title: Takeaway
      text: Global listwise objectives plus smoothed, progressive reweighting treat popularity bias as an objective-design problem rather than a post-hoc correction, in line with the adaptive-recommendation line on reliable ranking under changing exposure.
