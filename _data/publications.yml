  digest_note: A generative recommendation paper that studies hierarchical structure and preference-aware modeling beyond flat user-history sequences.
  paper_url: https://arxiv.org/abs/2603.00980
  paper_label: arXiv
  digest_blocks:
    - title: Problem
      text: Generative recommenders treat user history as a flat sequence of semantically equal items. This ignores the hierarchical structure of behavior, where items are grouped by interaction sessions or contexts, and it treats all historical items as equally reliable even though preference strength and uncertainty vary over time.
    - title: Approach
      text: HPGR is a plug-in enhancement for generative recommenders built from two parts. A Session Enhancement Module models user history hierarchically beyond the flat-sequence assumption, and preference-aware weighting estimates the reliability of historical items when conditioning generation.
    - title: Public evidence
      text: Experiments on public benchmarks report state-of-the-art performance, with both the hierarchical and preference-aware components contributing in ablations. The public abstract does not give numeric metrics.
    - title: Takeaway
      text: Structured intent over time and explicit reliability weighting extend generative recommendation toward the adaptive-recommendation line's concern with changing user evidence.
- id: invariant-feature-learning
  title: Invariant feature learning for counterfactual watch-time prediction in video recommendation
  year: 2026
  venue: Proceedings of the AAAI Conference on Artificial Intelligence (AAAI '26)
  venue_short: AAAI
  authors: Chenghou Jin, Yixin Ren, Hongxu Ma, Yewei Xia, Yi Guan, Hao Zhang, Jiandong Ding, Jihong Guan, Shuigeng Zhou
  topic: recommender-systems
  program: adaptive-recommendation
  level: a
  selected: true
  status: published
  image: "/assets/images/Invariant-Feature-Learning.webp"
  selected_label: AAAI 2026
  selected_summary: Invariant feature learning separates duration effects from true user preference in short-video recommendation.
  digest_url: "/aaai-difl/"
  digest_label: Digest
  doi_url: https://doi.org/10.1609/aaai.v40i17.38518
  digest_note: A video recommendation paper on counterfactual watch-time prediction and feature learning under duration-related bias.
  digest_blocks:
    - title: Problem
      text: Watch-time feedback in video recommendation is confounded by video duration. Longer videos mechanically accumulate more watch time, so prediction models drift toward duration effects instead of true preference. Existing backdoor-adjustment approaches discretize duration into groups and combine group-wise models, which the authors argue is prone to misspecification under feature distribution shift across groups.
    - title: Approach
      text: Duration-Invariant Feature Learning (DIFL) reinterprets the debiasing task as invariant learning. A kernel-based regularizer forces learned representations to stay invariant across duration groups, reducing sensitivity to how the groups are drawn and supporting counterfactual watch-time prediction.
    - title: Public evidence
      text: Experiments on public benchmarks and a large-scale production dataset report state-of-the-art performance against duration-bias baselines. The public abstract does not give numeric metrics, so treat the claim as benchmark-level evidence rather than measured online lift.
    - title: Takeaway
      text: Invariant learning gives the counterfactual watch-time line a way to separate preference signal from duration conditions without committing to one discretization of time.
