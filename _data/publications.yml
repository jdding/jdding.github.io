  digest_url: "/deltagate/"
  digest_label: Digest
  digest_note: A RecSys 2026 paper defining zero-observation user reactivation and introducing DeltaGate, a frozen-backbone dimensional gating plugin for long-gap returning users.
  digest_blocks:
    - title: Problem
      text: Returning users may have months or years without observed behavior, so a model's last user representation can become unreliable even when pre-gap history exists.
    - title: Method
      text: DeltaGate keeps the sequential recommendation backbone frozen and learns a dimension-wise gate that routes each representation dimension between personalized history and a learned global prior.
    - title: Findings
      text: Under the Gap-Synthesize Protocol on Amazon datasets, standard sequential recommenders decline as inactivity gaps widen; in the >365d Video Games bucket, DG-BERT4Rec reaches 0.046 Hit@10 versus 0.025 for BERT4Rec.
    - title: Deployment boundary
      text: End-to-end retraining can reach higher absolute accuracy, while the frozen DeltaGate plugin preserves zero backbone drift, uses 66K trainable parameters, and keeps the adaptation behavior inspectable.
- id: skillresolve-bench
  title: 'Right Family, Wrong Skill: Evaluating Risk Exposure in Agent Skill Retrieval'
  year: 2026
  venue: arXiv preprint arXiv:2606.10388
  venue_short: arXiv
  authors: Jiandong Ding, Honglei Ji, Ming Liu, Tao Duan
  topic: llm-agents
  program: auditable-retrieval
  level: c
  selected: false
  status: preprint
  paper_url: https://arxiv.org/abs/2606.10388
  paper_label: arXiv
  digest_url: "/skillresolve-bench/"
  digest_label: Digest
  digest_note: A study of same-capability risk exposure in agent skill retrieval, measuring when systems surface a risky sibling despite finding the right capability family.
  digest_blocks:
    - title: Problem
      text: In agent skill libraries, many skills expose similar capability descriptions. A retrieval system can pick the correct capability family and still surface a sibling skill that differs on execution-controlling contracts such as resources, preconditions, procedures, or artifacts. The paper names this failure mode same-capability risk-exposure retrieval.
    - title: Benchmark
      text: SameCapRisk-Bench contains 940 skill-risk units and 1,327 query cases. Units are either single-query (553, including 69 development units) or paired (387 units contributing 774 queries that exchange helpful and risky roles across queries). Evaluation uses a held-out split of 871 units and 1,258 queries, and the release records provenance and leakage checks.
    - title: Public evidence
      text: On the held-out split, neural retrievers reach Recall@3 of 0.723 to 0.936 while exposing a risky sibling at HSR@3 of 0.386 to 0.402 (RRF 0.723/0.387, SkillRouter 0.910/0.386, SkillRet 0.928/0.389, R3-Skill 0.925/0.396, SkillSight 0.936/0.402). Applying a released family selector to their score orders cuts HSR@3 to 0.110 to 0.154 at a Recall@3 cost (0.781 to 0.851), and an auxiliary scorer-plus-selection control reports 0.731 Recall@3 with HSR@3 0.136. Retrieving more items raises exposure further (HSR 0.684 to 0.951 at K=20). These are benchmark measurements, not production deployment results.
    - title: Takeaway
      text: Capability matching and same-family risk exposure should be reported together. HSR@K serves as a targeted exposure certificate for a fixed skill library, complementing the auditable-retrieval line on inspecting interfaces before they become production dependencies.
