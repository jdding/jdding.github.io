  selected_label: arXiv 2024
  selected_summary: Disaggregated LLM serving that scales prefill and decoding across large clusters.
  paper_url: https://arxiv.org/pdf/2408.08147
  paper_label: PDF
  digest_url: "/pd-serve/"
  digest_label: Digest
  doi_url: https://doi.org/10.48550/arxiv.2408.08147
  digest_note: A systems paper on disaggregated large language model serving, separating serving stages to support large-scale inference.
  digest_blocks:
    - title: Problem
      text: Serving disaggregated LLMs across tens of thousands of accelerators requires fine-grained organization of prefill and decoding workloads with dynamic P/D ratio adjustment. Inaccurate global workload estimates cause prefill timeouts, and device-to-device KVCache transfer over cluster-level RDMA stays underutilized.
    - title: Approach
      text: P/D-Serve is an end-to-end system covering fine-grained P/D mapping over RoCE networks, on-demand forwarding that avoids prefill timeouts under workload-estimate error, and optimized D2D KVCache transfer. It is built on Ascend hardware and MindSpore.
    - title: Public evidence
      text: The public abstract states that P/D-Serve has been deployed over tens of thousands of NPUs in commercial use for more than eight months, and reports further improvements of 60% in end-to-end throughput, 42% on the time-to-first-token SLO metric, and 46% in D2D transfer time. The abstract does not name the comparison baseline for these three figures. A 6.7x throughput increase is reported for the optimized end-to-end system compared with aggregated LLM serving; whether that comparison is a production or testbed measurement is not stated. Treat all figures as operator-reported under the conditions above.
    - title: Takeaway
      text: The work treats disaggregation as a cluster-level scheduling and transfer problem, complementing the site's line on reliable serving under changing load and hardware conditions.
